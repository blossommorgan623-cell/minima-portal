ss out on these incredible opportunities. Be sure to join now and don't miss your chance to be part of something big!\"},\"nft\":{\"title\":\"NFT communities\",\"description\":\"NFT stands for \\\"non-fungible token\\\", which is a unique digital asset that represents ownership of a specific item or piece of content. They are commonly used to represent art, music, collectibles, and gaming items.\"},\"art\":{\"title\":\"Art communities\",\"description\":\"Art can refer to a variety of creative works that are represented and/or created using blockchain technology. This can include digital art, virtual installations, and other forms of interactive media.\"},\"dao\":{\"title\":\"DAO communities\",\"description\":\"A DAO, or Decentralized Autonomous Organization, is a decentralized group or community that operates on blockchain technology and makes decisions through a set of rules encoded in smart contracts.\"},\"gaming\":{\"title\":\"Gaming communities\",\"description\":\"Gaming refers to the use of blockchain technology to facilitate the creation, distribution, and play of games. This can include the use of NFTs to represent in-game items, or the use of smart contracts to facilitate in-game economies.\"},\"music\":{\"title\":\"Music communities\",\"description\":\"Music within web3 refers to the creation and distribution of music using blockchain technology. This can include the creation of unique NFTs for songs or albums, or the use of smart contracts to facilitate royalty payments for artists.\"},\"collectibles\":{\"title\":\"Collectibles communities\",\"description\":\"Collectibles are digital items that are bought, sold, and traded on the blockchain. They can include virtual items from games, unique digital artwork, or other forms of virtual collectibles.\"},\"defi\":{\"title\":\"DeFi communities\",\"description\":\"DeFi, or Decentralized Finance, refers to the use of blockchain technology to enable financial transactions and services outside of traditional financial institutions.\"},\"metaverse\":{\"title\":\"Metaverse communities\",\"description\":\"The metaverse is a collective virtual shared space, created by the convergence of virtually enhanced physical reality and physically persistent virtual space, including the sum of all virtual worlds, augmented reality, and the internet.\"},\"infrastructure\":{\"title\":\"Infrastructure communities\",\"description\":\"Web3 infrastructure refers to the tools, services, and platforms that are needed to build and operate decentralized applications on the blockchain. This can include decentralized storage solutions, decentralized compute resources, and other types of infrastructure that make it easier to build on web3.\"},\"education\":{\"title\":\"Education communities\",\"description\":\"Education can refer to the use of blockchain technology to facilitate the creation, distribution, and verification of educational content and credentials. This can include the use of smart contracts to automate the awarding of degrees or certifications, or the use of NFTs to represent educational materials.\"},\"startup\":{\"title\":\"Startup communities\",\"description\":\"A web3 startup is a company or organization that is focused on building products or services using blockchain technology. This can include the creation of decentralized applications, the development of infrastructure tools, or the exploration of other ways to leverage web3 technology.\"},\"meme\":{\"title\":\"Meme communities\",\"description\":\"Meme communities are groups of people who share and create memes. Memes are images or videos that are shared online and often used to express a particular idea or emotion.\"},\"ai-agent\":{\"title\":\"AI Agent communities\",\"description\":\"AI Agent communities are groups of people who use AI agents to create and share content. AI agents are software programs that can be used to automate tasks, generate content, and interact with users.\"}},\"recommended-quests-title\":\"Quests with zap e do it\",\"title\":\"Life at Zealy\",\"paragraphs\":\"\u003cp\u003eAt Zealy we're lovers of product, tech and design. We are entrepreneurs and extra mile walkers. Steady improvers and fast movers. We're truth-sayers, team-players, future leaders - we make things happen.\u003c/p\u003e\u003cp\u003eWe care about crafting exceptional software products. We like to work as a small team with people who are excited about what they do. Everyone here is always trying to get better, learn more, and become an expert in what they do.\u003c/p\u003e\u003cp\u003eZealy is a remote-first team, following the European timezone with really light processes. We encourage focusing on deep work without distractions and turning off notifications. For important decisions, we prefer writing things down async on Notion.\u003c/p\u003e\"},\"quote\":\"Calling lovers of product, tech and design, and those who change things.\",\"perks\":{\"title\":\"Perks \u0026 benefits\",\"compensation\":\"Competitive salary and equity\",\"insurance\":\"Health, dental and vision insurance\",\"vacation\":\"6 weeks paid vacation\",\"meal\":\"Meal subsidies\",\"remote\":\"Remote friendly\",\"laptop\":\"M2 Macbook Pro, 32” monitor, keyboard and mouse\",\"learning\":\"Personal learning budget\",\"gym\":\"Fitness \u0026 health stipend\"},\"open-positions-section\":{\"subtitle\":\"Open positions\",\"title\":\"Zeal in\",\"view-all\":\"View all\",\"data\":\"Data\",\"engineering\":\"Engineering\",\"product\":\"Product\",\"business\":\"Business\",\"no-open-positions\":\"No open positions at the moment\"}},\"cookie-banner\":{\"title\":\"Your privacy\",\"description\":\"We and \u003clink\u003eour partners\u003c/link\u003e save information on your device to offer a customized experience and enable visitor statistics. You decide which type of cookies you accept in addition to the necessary ones needed for the website to work. You may change your settings at any time by clicking on \u003cConsentLink\u003eCookie preferences\u003c e a new quest\",\"from-scratch\":{\"title\":\"Start from scratch\",\"description\":\"Begin with a blank slate\"},\"use-template\":\"Use template\",\"search-placeholder\":\"Search Quests...\",\"quests-tab\":\"Quests\",\"modules-tab\":\"Modules\",\"back\":\"Back\"},\"subscriptions\":{\"verified\":{\"cta\":\"Get verified now\"},\"downgrade-confirmation-modal\":{\"title\":\"Are you sure you want to cancel?\",\"description\":\"Looks like you got a really good deal - you currently pay ${currentPrice} / {period} but our prices have increased to ${newPrice} / {period}.\"},\"confirmation-modal\":{\"title\":\"Are you sure you want to upgrade?\",\"description\":\"You will be charged immediately for the new plan.\"},\"interval\":{\"month\":\"month\",\"monthly\":\"Monthly\",\"year\":\"year\",\"yearly\":\"Annually\"},\"faq\":{\"headline\":\"Frequently Asked Questions\",\"faq1Title\":\"What is the Enterprise \u0026 Agencies plan?\",\"faq1Description\":\"This plan is specifically designed for long-term selected partners. It's suitable for companies aiming to find a product-market fit, products experiencing high usage volumes on Zealy, or agencies managing multiple projects on Zealy. Our Enterprise Plan is the most comprehensive option we offer, tailored to meet the unique needs of each community. If it feels like a fit, please answer the questions here to help us better understand your goals and provide you with the best plan to fit your needs.\",\"faq2Title\":\"What happens if I reach or exceed the Free plan limits?\",\"faq2Description\":\"Congratulations! It means your community is very engaged. When you reach the free plan limits, here's what happens: \u003cul\u003e\u003cli\u003e\u003cstrong\u003eUpgrade option\u003c/strong\u003e: You'll be asked to upgrade to a Premium plan.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eGrace period\u003c/strong\u003e: The first time this happens, you'll get a 7-day grace period to arrange payment.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eNo upgrade\u003c/strong\u003e: If you choose not to upgrade, your community will be temporarily blocked until your usage resets. During this time, users won't be able to claim new quests.\u003c/li\u003e\u003c/ul\u003e\",\"faq3Title\":\"Can I pay with cryptocurrencies?\",\"faq3Description\":\"We accept cryptocurrencies only for yearly Enterprise plans, which are available to selected partners. To check if you qualify, please contact us by clicking on the Enterprise \u0026 Agency plan.\",\"faq4Title\":\"I am managing 3+ communities on Zealy. Do you have a special offer?\",\"faq4Description\":\"If you manage several communities, you can contact us through our chat by clicking on the Enterprise \u0026 Agency plan in settings.\",\"faq5Title\":\"What happens if I reach the quest claim limit on a paid plan? How do I pay for extra quests?\",\"faq5Description\":\"If you're on the Standard or Plus plan, you get 10,000 or 50,000 quest claims per month, respectively. Here's what happens if you exceed these limits: \u003cul\u003e\u003cli\u003e\u003cstrong\u003eNo freezing\u003c/strong\u003e: your community won't be frozen.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eExtra charges\u003c/strong\u003e: any extra quests claimed will be charged automatically at the end of the month: \u003cul\u003e\u003cli\u003eStandard Plan: $15 per 1,000 extra claimed quests\u003c/li\u003e\u003cli\u003ePlus Plan: $12 per 1,000 extra claimed quests\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\",\"faq6Title\":\"What does 'claim quest' mean and how is it calculated?\",\"faq6Description\":\"A \\\"claim quest\\\" happens every time a user in your community completes a quest. For example: \u003cul\u003e\u003cli\u003e1 user completing 100 quests = 100 claimed quests\u003c/li\u003e\u003cli\u003e50 users each completing 2 quests = 100 claimed quests\u003c/li\u003e\u003c/ul\u003e\",\"faq7Title\":\"Why isn't my community appearing on the landing page or during a search?\",\"faq7Description\":\"\u003cp\u003eYour community isn't showing up on the Zealy homepage or in searches because it isn't verified. Only verified projects can be seen directly by users. This helps us recommend only trusted projects to our users.\u003c/p\u003e\u003cp\u003eTo get your project verified:\u003c/p\u003e\u003col\u003e\u003cli\u003eSign up for one of our plans: Standard, Plus, or Enterprise.\u003c/li\u003e\u003cli\u003eYour project will be reviewed and verified within 48 hours.\u003c/li\u003e\u003c/ol\u003e\",\"faq8Title\":\"How do I get promoted?\",\"faq8Description\":\"\u003cul\u003e\u003cli\u003e\u003cstrong\u003eStandard Plan\u003c/strong\u003e: You are listed on our homepage, giving you visibility within our network. It's a good start.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003ePlus Plan\u003c/strong\u003e: For extra visibility, subscribe to the Plus plan. You'll get: \u003cul\u003e\u003cli\u003eAccess to Partnerships Network.\u003c/li\u003e\u003cli\u003ePromotion on the homepage for 1 day each month. Once you subscribe, you'll be able to book promotion on Zealy from your Billing settings.\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eEnterprise Plan\u003c/strong\u003e: For maximum visibility, subscribe to the Enterprise plan. You'll get: \u003cul\u003e\u003cli\u003ePromotion on the homepage for 3 days each month.\u003c/li\u003e\u003cli\u003eRetweets and announcements on Telegram.\u003c/li\u003e\u003c/ul\u003e\u003c/li\u003e\u003c/ul\u003e\u003cp\u003eNote: the enterprise plan is selective and available only to long-term partners.\u003c/p\u003e\",\"fullFaq\":\"More questions? Check out the full FAQ\",\"fullFaqLinkCTA\":\"here\"},\"plan-state\":{\"cancelled\":{\"label\":\"Subscription cancelled\",\"date\":\"Ends {date, date, ::MMM d, yyyy}\"},\"downgrade-scheduled\":{\"label\":\"Downgrade scheduled\",\"date\":\"Effective {date, date, ::MMM d, yyyy}\"},\"active\":{\"label\":\"$${price} per {period}\",\"date\":\"Renews {date, date, ::MMM d, yyy
